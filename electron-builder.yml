appId: com.gvue.app
productName: GVue

# Flux de mise à jour (electron-updater lit la même config) : releases GitHub.
#
# Dépôt SÉPARÉ « gvue-releases », PUBLIC, qui ne contient que les installeurs :
# le code source (dépôt « gvue ») reste privé. Indispensable — electron-updater
# lit https://github.com/OWNER/REPO/releases.atom SANS authentification : sur un
# dépôt privé il reçoit 404 et conclut « aucune release ». Embarquer un jeton
# dans l'app est exclu (il partirait chez chaque client, avec accès au code).
#
# La release est créée en BROUILLON (défaut) : GitHub refuse une release publiée
# si le tag n'existe pas encore. On publie le brouillon en un clic sur GitHub
# (cela crée le tag) ; ensuite l'auto-update voit la version.
publish:
  provider: github
  owner: gjelal-bjrm
  repo: gvue-releases

directories:
  output: dist
  buildResources: build

# node-pty est fourni en prebuilds N-API (compatibles toutes versions Electron) :
# inutile — et impossible sans outils C++ — de le recompiler depuis les sources.
npmRebuild: false

# Inclut tout par défaut (out/ + node_modules de prod), sauf les fichiers de dev.
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!**/{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/{.eslintrc*,.prettier*,.editorconfig,.gitignore,.gitattributes}'
  - '!**/{README.md,CHANGELOG.md}'
  - '!**/{.env,.env.*,.npmrc}'
  - '!build/**'
  - '!*.zip'
  - '!*.bat'

# Icône embarquée hors asar (utilisée par le plateau système au runtime ;
# `build/` est exclu des fichiers de l'app).
extraResources:
  - from: build/icon.png
    to: icon.png
  # Pont MCP (stdio) : lancé par les clients IA (Claude Code…), il relaie vers
  # l'instance GVue en cours (serveur local opt-in).
  - from: scripts/gvue-mcp.cjs
    to: gvue-mcp.cjs

# Modules natifs : doivent vivre hors de l'asar pour être exécutés/chargés.
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/@vscode/ripgrep-win32-*/**'

win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GVue
  uninstallDisplayName: GVue
  # Pas de lancement auto en fin d'install (évite l'erreur « .lnk sans application
  # associée » si l'exe vient d'être bloqué/quarantainé par l'antivirus).
  runAfterFinish: false
